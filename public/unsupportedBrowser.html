<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsupported Browser</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      color: #343a40;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      max-width: 600px;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #dc3545;
    }
    a {
      color: #007bff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Unsupported Browser</h1>
    <p>Your browser is outdated and does not support this application. Please upgrade to a modern browser to continue.</p>
    <p>Recommended browsers:</p>
    <ul>
      <li><a href="https://www.google.com/chrome/" target="_blank">Google Chrome</a></li>
      <li><a href="https://www.mozilla.org/firefox/new/" target="_blank">Mozilla Firefox</a></li>
      <li><a href="https://www.microsoft.com/edge" target="_blank">Microsoft Edge</a></li>
      <li><a href="https://www.apple.com/safari/" target="_blank">Apple Safari</a></li>
    </ul>
  </div>
</body>
</html>
