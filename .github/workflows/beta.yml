name: BETA VM Deployment 

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  HOST: cpc-beta.ukwest.cloudapp.azure.com
  USERNAME: ubuntu
  PORT: 22
    
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    env:
      CI: false
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16.20.2
          cache: 'npm'

      - run: npm install
      - run: npm run build
        env: 
          CI: false

      - name: Verify build output
        run: |
          ls -la build/
          [ -f build/index.html ] || { echo "Error: index.html not found in build directory"; exit 1; }

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build/
          retention-days: 2

  Deployment:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: .

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USERNAME }}
          key: ${{ secrets.NEW_SSH_KEY }}
          port: ${{ env.PORT }}
          script: |
            sudo rm -rf /var/www/html/*
            sudo mkdir -p /var/www/html
            sudo chown -R ${{ env.USERNAME }}:${{ env.USERNAME }} /var/www/html
            sudo chmod -R 755 /var/www/html

      - name: Deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USERNAME }}
          key: ${{ secrets.NEW_SSH_KEY }}
          port: ${{ env.PORT }}
          source: "build/*"
          target: /var/www/html/
          overwrite: true

      - name: Verify deployment
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USERNAME }}
          key: ${{ secrets.NEW_SSH_KEY }}
          port: ${{ env.PORT }}
          script: |
            ls -la /var/www/html/
            [ -f /var/www/html/index.html ] || { echo "Error: index.html not deployed"; exit 1; }
            sudo chown -R www-data:www-data /var/www/html
            sudo systemctl restart nginx
